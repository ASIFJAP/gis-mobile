name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 @capacitor/filesystem@6.0.2 @capacitor/share@6.0.3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.asifiqbal.gis",
            "appName": "GIS गणना",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          pip install --break-system-packages pillow || python3 -c "import PIL"
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = "android/app/src/main/res"
          src = Image.open("icon-512.png").convert("RGBA")
          shutil.rmtree(os.path.join(res, "mipmap-anydpi-v26"), ignore_errors=True)
          for d, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = os.path.join(res, "mipmap-" + d)
              os.makedirs(folder, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              for n in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  img.save(os.path.join(folder, n))
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GIS_Ganana.apk

      - name: Publish APK (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GIS APK ${{ github.run_number }}
          files: GIS_Ganana.apk

      - name: Upload APK (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: GIS-APK
          path: GIS_Ganana.apk
